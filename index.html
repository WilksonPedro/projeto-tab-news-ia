<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de nomes</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f2f8;
        color: #2c2436;
        font-family: system-ui, sans-serif;
      }
      main {
        box-sizing: border-box;
        width: min(90%, 420px);
        padding: 2rem;
        border-radius: 16px;
        background: white;
        box-shadow: 0 8px 30px #2c243616;
      }
      h1 { margin-top: 0; font-size: 1.6rem; }
      ul { padding-left: 1.5rem; line-height: 2; }
      li::marker { color: #8155a4; }
    </style>
  </head>
  <body>
    <main>
      <h1>Lista de nomes</h1>
      <ul>
        <li>Mythos</li>
        <li>Mythos: Humanity</li>
        <li>Triss</li>
        <li>Ember</li>
        <li>Mari</li>
        <li>Wilkson</li>
      </ul>
    </main>
  </body>
</html>
